services:
  x-homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    volumes:
      - /opt/homelab/homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
      - /etc/localtime:/etc/localtime:ro
    privileged: true
    network_mode: host
    labels:
      - "traefik.enable=true"
      # Home Assistant Routing (accessible at hass.yourdomain.local)
      - "traefik.http.routers.ha.rule=Host(`ha.homelab.iot`)"
      - "traefik.http.routers.ha.entrypoints=web"
      #- "traefik.http.routers.ha.tls=true" #Only use if using HTTPS - while testing comment out
      - "traefik.http.services.ha.loadbalancer.server.port=8123"
      # Because homeassistant uses Network_mode:Host -- Use the scheme and urls entries below instead      
      - "traefik.http.services.hass.loadbalancer.server.scheme=http"
      - "traefik.http.services.hass.loadbalancer.servers.url=http://192.168.20.30:8123"

  x-esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:stable
    restart: always
    privileged: true
    volumes:
      - /opt/homelab/esphome/config:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: host   # ESPHome dashboard port
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    environment:
      - USERNAME=${esphome-username}
      - PASSWORD=${esphome-password}
    labels:
      - "traefik.enable=true"
      # ESPHome Routing (accessible at esphome.yourdomain.local)
      - "traefik.http.routers.esphome.rule=Host(`esphome.homelab.iot`)"
      - "traefik.http.routers.esphome.entrypoints=web"
      #- "traefik.http.routers.esphome.tls=true" #Only use if using HTTPS - while testing comment out
      - "traefik.http.services.esphome.loadbalancer.server.port=6052"
      # Because esphome uses Network_mode:Host -- Use the scheme and urls entries below as well
      - "traefik.http.services.esphome.loadbalancer.server.scheme=http"
      - "traefik.http.services.esphome.loadbalancer.servers.url=http://192.168.20.30:6052"

